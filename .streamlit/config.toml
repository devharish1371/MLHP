# MetaSearch — shadcn-inspired dark theme

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0F0F11"
secondaryBackgroundColor = "#1A1A1F"
codeBackgroundColor = "#1E1E24"
textColor = "#FAFAFA"
linkColor = "#818CF8"
borderColor = "#27272A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#E4E4E7"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#6366F1", "#8B5CF6", "#A78BFA", "#C4B5FD", "#22C55E", "#EF4444", "#F59E0B"]

grayColor = "#A1A1AA"
blueColor = "#6366F1"
greenColor = "#22C55E"
redColor = "#EF4444"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#8B5CF6"

dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#1A1A1F"

[theme.sidebar]
backgroundColor = "#18181B"
secondaryBackgroundColor = "#1A1A1F"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
borderColor = "#27272A"
primaryColor = "#6366F1"
paddingTop = "1rem"
